name: Android Hosted Runtime Boundaries

on:
  workflow_dispatch:
  schedule:
    # Weekly boundary runtime check at 03:30 Asia/Shanghai on Monday.
    - cron: "30 19 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-boundaries:
    name: API 23 + API 36 direct runtime
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android 16 build dependencies
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.3.11579264"

      - name: Prepare ephemeral fixture credentials
        shell: bash
        run: |
          set -euo pipefail
          private_env="$RUNNER_TEMP/leona-github-matrix-private.env"
          umask 077
          {
            printf 'LEONA_API_KEY=lk_ci_app_%s\n' "$(openssl rand -hex 24)"
            printf 'LEONA_CLOUD_TEST_TOKEN=ct_%s\n' "$(openssl rand -hex 24)"
          } > "$private_env"
          chmod 600 "$private_env"
          echo "LEONA_GITHUB_MATRIX_PRIVATE_ENV=$private_env" >> "$GITHUB_ENV"
          echo "LEONA_GITHUB_MATRIX_OUT=$RUNNER_TEMP/leona-github-cloud-runtime" >> "$GITHUB_ENV"

      - name: Build one cloudTest APK candidate
        working-directory: leona-sdk-android
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$LEONA_GITHUB_MATRIX_PRIVATE_ENV"
          set +a
          export ORG_GRADLE_PROJECT_LEONA_API_KEY="$LEONA_API_KEY"
          export ORG_GRADLE_PROJECT_LEONA_REPORTING_ENDPOINT="http://10.0.2.2:18080"
          export ORG_GRADLE_PROJECT_LEONA_CLOUD_TEST_TOKEN="$LEONA_CLOUD_TEST_TOKEN"
          ./gradlew :sample-app:assembleCloudTest \
            --no-daemon \
            --no-build-cache \
            --no-configuration-cache
          unset ORG_GRADLE_PROJECT_LEONA_API_KEY
          unset ORG_GRADLE_PROJECT_LEONA_REPORTING_ENDPOINT
          unset ORG_GRADLE_PROJECT_LEONA_CLOUD_TEST_TOKEN
          unset LEONA_API_KEY LEONA_CLOUD_TEST_TOKEN

      - name: API 23 direct sense/report
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash leona-sdk-android/scripts/run-github-hosted-runtime-matrix.sh 23

      - name: API 36 direct sense/report
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash leona-sdk-android/scripts/run-github-hosted-runtime-matrix.sh 36

      - name: Verify same-candidate boundary evidence
        run: |
          python3 leona-sdk-android/scripts/verify-github-hosted-runtime-evidence.py \
            --input-root "$LEONA_GITHUB_MATRIX_OUT" \
            --output-dir "$RUNNER_TEMP/leona-github-cloud-runtime-verification" \
            --required-api 23 \
            --required-api 36

      - name: Upload redacted runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leona-github-hosted-runtime-boundaries
          path: |
            ${{ runner.temp }}/leona-github-cloud-runtime/
            ${{ runner.temp }}/leona-github-cloud-runtime-verification/
          if-no-files-found: error
          retention-days: 14

      - name: Remove credential-bearing build state
        if: always()
        shell: bash
        run: |
          rm -f "${LEONA_GITHUB_MATRIX_PRIVATE_ENV:-}"
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          for path in [Path("leona-sdk-android/sample-app/build")]:
              if path.exists():
                  shutil.rmtree(path)
          for path in Path("leona-sdk-android/.gradle").glob("*/executionHistory"):
              if path.exists():
                  shutil.rmtree(path)
          PY
