name: Android Public SDK CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly public SDK check at 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

defaults:
  run:
    working-directory: leona-sdk-android

jobs:
  lint-and-test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android 6-16 build contract
        run: |
          python3 -m unittest discover -v -s scripts/tests -p 'test_*.py'
          python3 scripts/verify-android-6-16-compatibility.py \
            --android-sdk-root "$ANDROID_HOME" \
            --output-dir "$RUNNER_TEMP/leona-android-6-16-build-contract"

      - name: Run Android lint
        run: ./gradlew :sdk:lint --no-daemon

      - name: Run unit tests
        run: ./gradlew :sdk:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            leona-sdk-android/sdk/build/reports/tests/
            ${{ runner.temp }}/leona-android-6-16-build-contract/
          retention-days: 7

  assemble:
    name: Assemble AAR (debug + release)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK r26d
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Verify Kotlin 1.9 consumer compatibility
        env:
          LEONA_KOTLIN19_CONSUMER_OUT: ${{ runner.temp }}/leona-kotlin19-consumer
        run: scripts/verify-kotlin-1-9-consumer.sh

      - name: Assemble debug
        run: ./gradlew :sdk:assembleDebug --no-daemon

      - name: Assemble release
        run: ./gradlew :sdk:assembleRelease --no-daemon

      - name: Assemble API 36 sample
        run: ./gradlew :sample-app:assembleDebug :sample-app:assembleRelease --no-daemon

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v7
        with:
          name: leona-sdk-aars
          path: leona-sdk-android/sdk/build/outputs/aar/*.aar
          retention-days: 30

  native-sanity:
    name: Native source sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-tidy / clang-format
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format

      - name: clang-format check (changed files)
        working-directory: .
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          BASE_SHA=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # For PRs, format-check only files changed relative to base branch.
            git fetch --no-tags --prune --depth=1 origin "${GITHUB_BASE_REF}"
            BASE_SHA="origin/${GITHUB_BASE_REF}"
          else
            # For pushes/tags/schedule/workflow_dispatch, compare against the previous commit when available.
            BASE_SHA="${BEFORE_SHA:-}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD^)"
              echo "No event base SHA; falling back to HEAD^=${BASE_SHA}"
            else
              echo "No base SHA available; skipping clang-format check."
              exit 0
            fi
          fi

          changed_files=()
          while IFS= read -r file; do
            changed_files+=("${file}")
          done < <(
            git diff --name-only "${BASE_SHA}"...HEAD -- "leona-sdk-android/sdk/src/main/cpp" \
              | grep -E '\.(cpp|h)$' || true
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No native .cpp/.h changes; skipping clang-format check."
            exit 0
          fi

          printf '%s\n' "${changed_files[@]}" | xargs clang-format --dry-run --Werror --style=Google

  publish-release:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    needs: [lint-and-test, assemble, native-sanity]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK r26d
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"

      - name: Build release AAR
        run: ./gradlew :sdk:assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/release-assets
          cp sdk/build/outputs/aar/sdk-release.aar "build/release-assets/leona-sdk-android-${VERSION}.aar"
          (
            cd build/release-assets
            sha256sum "leona-sdk-android-${VERSION}.aar" > "leona-sdk-android-${VERSION}.aar.sha256"
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            leona-sdk-android/build/release-assets/*.aar
            leona-sdk-android/build/release-assets/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true

  publish-maven:
    name: Publish Maven package
    runs-on: ubuntu-latest
    needs: [lint-and-test, assemble, native-sanity]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK r26d
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"

      - name: Publish release publication to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :sdk:publishReleasePublicationToGitHubPackagesRepository --no-daemon
