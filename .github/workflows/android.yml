name: Android Public SDK CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly public SDK check at 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: leona-sdk-android

jobs:
  lint-and-test:
    name: Lint + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android 6-16 build contract
        run: |
          python3 -m unittest discover -v -s scripts/tests -p 'test_*.py'
          python3 scripts/verify-android-6-16-compatibility.py \
            --android-sdk-root "$ANDROID_HOME" \
            --output-dir "$RUNNER_TEMP/leona-android-6-16-build-contract"

      - name: Verify secure AGP build classpath
        run: |
          ./gradlew buildEnvironment --no-daemon --console=plain \
            | tee "$RUNNER_TEMP/leona-build-environment.log"
          python3 - "$RUNNER_TEMP/leona-build-environment.log" <<'PY'
          from pathlib import Path
          import sys

          report = Path(sys.argv[1]).read_text(errors="replace")
          expected = {
              "org.apache.commons:commons-lang3": "3.18.0",
              "org.bitbucket.b_c:jose4j": "0.9.6",
              "org.bouncycastle:bcpkix-jdk18on": "1.84",
              "org.bouncycastle:bcprov-jdk18on": "1.84",
              "org.bouncycastle:bcutil-jdk18on": "1.84",
              "org.jdom:jdom2": "2.0.6.1",
          }
          missing = [
              f"{module}:{version}"
              for module, version in expected.items()
              if not any(
                  line.rstrip().endswith(f"{module}:{version}")
                  or f"{module}:" in line and f" -> {version}" in line
                  for line in report.splitlines()
              )
          ]
          if missing:
              raise SystemExit("insecure or unresolved AGP classpath: " + ", ".join(missing))
          print(f"secure AGP classpath verified: {len(expected)} modules")
          PY

      - name: Run Android lint
        run: ./gradlew :sdk:lint --no-daemon

      - name: Run unit tests
        run: ./gradlew :sdk:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report
          path: |
            leona-sdk-android/sdk/build/reports/tests/
            ${{ runner.temp }}/leona-android-6-16-build-contract/
          retention-days: 7

  assemble:
    name: Assemble AAR (debug + release)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK r26d
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Verify Kotlin 1.9 consumer compatibility
        env:
          LEONA_KOTLIN19_CONSUMER_OUT: ${{ runner.temp }}/leona-kotlin19-consumer
        run: scripts/verify-kotlin-1-9-consumer.sh

      - name: Assemble debug
        run: ./gradlew :sdk:assembleDebug --no-daemon

      - name: Assemble release
        run: ./gradlew :sdk:assembleRelease --no-daemon

      - name: Assemble API 36 sample
        run: ./gradlew :sample-app:assembleDebug :sample-app:assembleRelease --no-daemon

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: leona-sdk-aars
          path: leona-sdk-android/sdk/build/outputs/aar/*.aar
          retention-days: 30

  native-sanity:
    name: Native source sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install clang-tidy / clang-format
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format

      - name: clang-format check (changed files)
        working-directory: .
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          BASE_SHA=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # For PRs, format-check only files changed relative to base branch.
            git fetch --no-tags --prune --depth=1 origin "${GITHUB_BASE_REF}"
            BASE_SHA="origin/${GITHUB_BASE_REF}"
          else
            # For pushes/tags/schedule/workflow_dispatch, compare against the previous commit when available.
            BASE_SHA="${BEFORE_SHA:-}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse HEAD^)"
              echo "No event base SHA; falling back to HEAD^=${BASE_SHA}"
            else
              echo "No base SHA available; skipping clang-format check."
              exit 0
            fi
          fi

          changed_files=()
          while IFS= read -r file; do
            changed_files+=("${file}")
          done < <(
            git diff --name-only "${BASE_SHA}"...HEAD -- "leona-sdk-android/sdk/src/main/cpp" \
              | grep -E '\.(cpp|h)$' || true
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No native .cpp/.h changes; skipping clang-format check."
            exit 0
          fi

          printf '%s\n' "${changed_files[@]}" | xargs clang-format --dry-run --Werror --style=Google

  publish-release:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    needs: [lint-and-test, assemble, native-sanity]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Download tested release AAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: leona-sdk-aars
          path: leona-sdk-android/build/tested-aars

      - name: Bind release asset to tested AAR
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TESTED="build/tested-aars/sdk-release.aar"
          test -f "$TESTED"
          mkdir -p build/release-assets
          cp "$TESTED" "build/release-assets/leona-sdk-android-${VERSION}.aar"
          sha256sum "build/release-assets/leona-sdk-android-${VERSION}.aar" > \
            "build/release-assets/leona-sdk-android-${VERSION}.aar.sha256"
          AAR_SHA256="$(cut -d' ' -f1 "build/release-assets/leona-sdk-android-${VERSION}.aar.sha256")"
          printf '{"commit":"%s","releaseTag":"%s","artifactSha256":"%s","sourceArtifact":"leona-sdk-aars/sdk-release.aar"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$AAR_SHA256" > build/release-assets/release-provenance.json

      - name: Sign release AAR with configured release key
        env:
          LEONA_RELEASE_ASC_PRIVATE_KEY: ${{ secrets.LEONA_RELEASE_ASC_PRIVATE_KEY }}
          LEONA_RELEASE_ASC_PASSPHRASE: ${{ secrets.LEONA_RELEASE_ASC_PASSPHRASE }}
          LEONA_RELEASE_ASC_KEY_ID: ${{ secrets.LEONA_RELEASE_ASC_KEY_ID }}
        run: |
          set -euo pipefail
          : "${LEONA_RELEASE_ASC_PRIVATE_KEY:?LEONA_RELEASE_ASC_PRIVATE_KEY is required for tag releases}"
          : "${LEONA_RELEASE_ASC_PASSPHRASE:?LEONA_RELEASE_ASC_PASSPHRASE is required for tag releases}"
          : "${LEONA_RELEASE_ASC_KEY_ID:?LEONA_RELEASE_ASC_KEY_ID is required for tag releases}"
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="build/release-assets/leona-sdk-android-${VERSION}.aar"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          KEY_FILE="$RUNNER_TEMP/leona-release-signing-key.asc"
          trap 'rm -f "$KEY_FILE"; gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$LEONA_RELEASE_ASC_PRIVATE_KEY" > "$KEY_FILE"
          gpg --batch --import "$KEY_FILE" >/dev/null
          gpg --batch --yes --pinentry-mode loopback --passphrase "$LEONA_RELEASE_ASC_PASSPHRASE" \
            --local-user "$LEONA_RELEASE_ASC_KEY_ID" --armor --detach-sign \
            --output "${ASSET}.asc" "$ASSET"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            leona-sdk-android/build/release-assets/*.aar
            leona-sdk-android/build/release-assets/*.sha256
            leona-sdk-android/build/release-assets/*.asc
            leona-sdk-android/build/release-assets/release-provenance.json
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          generate_release_notes: true

  publish-maven:
    name: Publish Maven package
    runs-on: ubuntu-latest
    needs: [lint-and-test, assemble, native-sanity]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NDK r26d
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"

      - name: Download tested release AAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: leona-sdk-aars
          path: leona-sdk-android/build/tested-aars

      - name: Rebuild and compare tested release AAR
        run: |
          set -euo pipefail
          test -f build/tested-aars/sdk-release.aar
          ./gradlew :sdk:assembleRelease --no-daemon
          expected="$(sha256sum build/tested-aars/sdk-release.aar | cut -d' ' -f1)"
          actual="$(sha256sum sdk/build/outputs/aar/sdk-release.aar | cut -d' ' -f1)"
          test "$expected" = "$actual" || {
            echo "release provenance mismatch: tested=$expected rebuilt=$actual" >&2
            exit 1
          }

      - name: Publish signed release publication to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEONA_RELEASE_ASC_PRIVATE_KEY: ${{ secrets.LEONA_RELEASE_ASC_PRIVATE_KEY }}
          LEONA_RELEASE_ASC_PASSPHRASE: ${{ secrets.LEONA_RELEASE_ASC_PASSPHRASE }}
          LEONA_RELEASE_ASC_KEY_ID: ${{ secrets.LEONA_RELEASE_ASC_KEY_ID }}
          LEONA_REQUIRE_PUBLISH_SIGNING: "true"
        run: ./gradlew :sdk:publishReleasePublicationToGitHubPackagesRepository --no-daemon
